name: Minos investigation maintenance

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only the fixed targets from a previously inspected inventory
        type: boolean
        default: false
      approved_plan_sha256:
        description: Exact plan fingerprint from a successful inventory
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: minos-opencv-validation
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: [self-hosted, Windows, ARM64, Marcpe-d4]
    timeout-minutes: 20
    steps:
      - name: Verify requested runner
        shell: pwsh
        run: |
          if ($env:RUNNER_NAME -ine 'MARCPE-D4') { throw 'Unexpected runner' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false
      - name: Refuse cleanup while build tools are active
        if: inputs.apply
        shell: pwsh
        run: |
          $active = @(Get-Process | Where-Object {
            $_.ProcessName -match '^(cl|clang|clang\+\+|clang-cl|link|lld-link|ninja|cmake|MSBuild|screen_.+|opencv_perf_.+)$'
          })
          if ($active.Count) {
            $active | Select-Object Id, ProcessName | Format-Table
            throw 'Build or runtime tools are active; nothing deleted'
          }
      - name: Inventory or clean fixed investigation artifacts
        shell: pwsh
        env:
          APPLY_CLEANUP: ${{ inputs.apply }}
          APPROVED_PLAN: ${{ inputs.approved_plan_sha256 }}
        run: |
          $arguments = @('.\scripts\maintain_minos_runner.py')
          if ($env:APPLY_CLEANUP -eq 'true') {
            $arguments += @('--apply', '--approved-plan-sha256', $env:APPROVED_PLAN)
          }
          python @arguments
      - name: Publish maintenance inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minos-maintenance-${{ github.run_id }}
          path: .work/maintenance-${{ github.run_id }}.json
          if-no-files-found: error
