name: Minos OpenCV validation

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Validation phase
        type: choice
        options:
          - probe
          - llvm
          - study
          - export-runtime
        default: probe
      source_run_id:
        description: Original run ID for export-runtime recovery only
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: minos-opencv-validation
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: [self-hosted, Windows, ARM64, Marcpe-d4]
    steps:
      - name: Verify requested runner
        shell: powershell
        run: |
          if ($env:RUNNER_NAME -ine 'MARCPE-D4') { throw 'Unexpected runner' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: false
      - name: Inspect benchmark prerequisites
        shell: powershell
        run: .\scripts\inspect_minos_runner.ps1
      - name: First Ninja LLVM clean build
        if: inputs.phase == 'llvm'
        shell: pwsh
        run: .\scripts\run_minos_quick.ps1
      - name: Publish first-build evidence
        if: always() && inputs.phase == 'llvm'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minos-llvm-first-${{ github.run_id }}
          path: results/minos-llvm-first-${{ github.run_id }}
          if-no-files-found: warn
      - name: Balanced five-configuration build study
        if: inputs.phase == 'study'
        shell: pwsh
        run: .\scripts\run_minos_study.ps1
      - name: Publish build timings before runtime testing
        if: always() && inputs.phase == 'study'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minos-builds-${{ github.run_id }}
          path: results/minos-builds-${{ github.run_id }}
          if-no-files-found: warn
      - name: Limited runtime comparison using preserved Minos libraries
        if: inputs.phase == 'study'
        timeout-minutes: 120
        shell: pwsh
        run: .\scripts\run_minos_runtime.ps1 -StudyRoot $env:MINOS_STUDY_ROOT
      - name: Publish runtime evidence
        if: always() && inputs.phase == 'study'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minos-runtime-${{ github.run_id }}
          path: results/minos-runtime-${{ github.run_id }}
          if-no-files-found: warn
      - name: Recover completed runtime evidence without repeating measurements
        if: inputs.phase == 'export-runtime'
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: .\scripts\export_minos_runtime.ps1 -SourceRunId $env:SOURCE_RUN_ID
      - name: Publish recovered runtime evidence
        if: inputs.phase == 'export-runtime'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: minos-runtime-${{ inputs.source_run_id }}
          path: ${{ env.MINOS_RUNTIME_EXPORT }}
          if-no-files-found: error
